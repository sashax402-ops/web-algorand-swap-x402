<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta property="og:site_name" content="ChepeastSwap">
<meta property="og:title" content="ChepeastSwap — Crypto Swap">
<meta property="og:description" content="Multi-chain crypto swap routes via LI.FI">
<title>ChepeastSwap — The Chepeast Swap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
<style>
  :root{
    --bg:#12151A; --panel:#1B1F26; --panel-2:#20252D; --text:#EDEEF0; --muted:#8A8F98;
    --accent:#5FBF95; --accent-dim:#3E7D63; --warn:#E8735F; --border:#2A2F38;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; padding:48px 20px;
  }
  .brand{width:100%; max-width:440px; display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .logo{display:flex; align-items:center; gap:8px;}
  .wordmark{font-size:17px; font-weight:600; letter-spacing:-0.01em;}
  .wordmark b{color:var(--accent); font-weight:700;}
  .brand-right{display:flex; align-items:center; gap:10px;}
  .langs{display:flex; gap:4px;}
  .langs button{
    background:none; border:1px solid var(--border); color:var(--muted);
    padding:5px 8px; border-radius:6px; font-size:11px; cursor:pointer;
    font-family:'IBM Plex Mono', monospace;
  }
  .langs button.active{color:var(--bg); background:var(--accent); border-color:var(--accent);}
  #walletBtn{
    background:var(--panel); border:1px solid var(--border); color:var(--text);
    padding:8px 14px; border-radius:8px; font-size:13px; cursor:pointer;
    font-family:'IBM Plex Mono', monospace; position:relative;
  }
  #walletBtn:hover{border-color:var(--accent-dim);}
  .wallet-wrap{position:relative;}
  .wallet-list{
    display:none; position:absolute; top:calc(100% + 6px); right:0; min-width:180px;
    background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:6px;
    z-index:10; box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  .wallet-list.show{display:block;}
  .wallet-list{width:300px; max-width:calc(100vw - 40px); max-height:65vh; overflow-y:auto;}
  .wallet-list .title{line-height:1.45;}
  .wallet-option:disabled{opacity:.55; cursor:default;}
  .wallet-summary{max-width:440px; width:100%; color:var(--muted); font-size:12px; line-height:1.6; margin:0 0 14px; overflow-wrap:anywhere;}
  .wallet-summary:empty{display:none;}
  .brand{flex-wrap:wrap; gap:12px;}
  .brand-right{width:100%; justify-content:space-between;}
  .wallet-list .title{font-size:11px; color:var(--muted); padding:6px 8px;}
  .wallet-option{
    display:block; width:100%; text-align:left; background:none; border:none; color:var(--text);
    padding:8px; border-radius:7px; cursor:pointer; font-size:13px; font-family:'IBM Plex Sans', sans-serif;
  }
  .wallet-option:hover{background:var(--panel-2);}
  .card{width:100%; max-width:440px; background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:6px;}
  .field{background:var(--panel-2); border-radius:12px; padding:16px 18px; position:relative;}
  .field + .field{margin-top:4px;}
  .field label{font-size:12px; color:var(--muted);}
  .field-row{display:flex; align-items:center; justify-content:space-between; margin-top:8px; gap:10px;}
  .amount-input{
    background:none; border:none; outline:none; color:var(--text);
    font-family:'IBM Plex Mono', monospace; font-size:28px; width:100%;
    font-variant-numeric: tabular-nums;
  }
  .amount-input::placeholder{color:#4A5058;}
  .mode-toggle{
    margin-top:8px; background:none; border:1px solid var(--border); border-radius:999px;
    padding:4px 10px; font-size:12px; color:var(--muted); cursor:pointer;
    font-family:'IBM Plex Mono', monospace; display:inline-flex; align-items:center; gap:5px;
  }
  .mode-toggle:hover{border-color:var(--accent-dim); color:var(--text);}
  .step-badge{
    display:inline-flex; align-items:center; justify-content:center;
    width:18px; height:18px; border-radius:50%; background:var(--warn);
    color:#fff; font-size:11px; font-weight:700; margin-right:6px;
    font-family:'IBM Plex Sans', sans-serif; vertical-align:middle; flex:none;
  }
  .amount-wrap{display:flex; align-items:center; flex:1; min-width:0;}
  .currency-prefix{font-family:'IBM Plex Mono', monospace; font-size:28px; color:var(--text); display:none;}
  .currency-prefix.show{display:inline;}
  select.token-select{
    background:var(--panel); border:1px solid var(--border); border-radius:999px;
    padding:8px 12px; font-size:13px; color:var(--text); white-space:nowrap; cursor:pointer;
    -webkit-appearance:none; appearance:none;
  }
  .swap-toggle{display:flex; justify-content:center; margin:2px 0; position:relative; height:0;}
  .swap-toggle button{
    position:relative; top:-12px; width:34px; height:34px; border-radius:10px;
    background:var(--panel); border:1px solid var(--border); color:var(--muted);
    cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:15px;
  }
  .swap-toggle button:hover{color:var(--accent); border-color:var(--accent-dim);}
  .receipt{padding:14px 18px 4px; font-size:12.5px; color:var(--muted); display:none;}
  .receipt.show{display:block;}
  .receipt .line{display:flex; justify-content:space-between; padding:5px 0;}
  .receipt .line span:last-child{color:var(--text); font-family:'IBM Plex Mono', monospace;}
  .cta{
    width:100%; margin-top:4px; padding:16px; border:none; border-radius:12px;
    background:var(--accent); color:#0B1310; font-size:15px; font-weight:600; cursor:pointer;
    font-family:'IBM Plex Sans', sans-serif;
  }
  .cta:disabled{opacity:.55; cursor:default;}
  .cta.pending{background:var(--panel-2); color:var(--muted); border:1px solid var(--border);}
  .cta.error{background:var(--warn); color:#2A0F0A;}
  .status{max-width:440px; width:100%; margin-top:16px; font-size:15px; color:var(--muted); text-align:center; line-height:1.5;}
</style>
</head>
<body>

<div class="brand">
  <div class="logo">
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
      <path d="M3 10h15m0 0-5-5m5 5-5 5" stroke="#5FBF95" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M23 16H8m0 0 5-5m-5 5 5 5" stroke="#EDEEF0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="wordmark">Chepeast<b>Swap</b></span>
  </div>
  <div class="brand-right">
    <div class="langs" id="langs">
      <button data-lang="en">EN</button>
      <button data-lang="es">ES</button>
      <button data-lang="fr">FR</button>
      <button data-lang="de">DE</button>
    </div>
    <div class="wallet-wrap">
      <button id="walletBtn" onclick="onWalletBtnClick()"><span class="step-badge">1</span><span id="walletBtnText">Connect wallet</span></button>
      <div id="walletList" class="wallet-list" aria-label="Wallet selection">
        <div class="title" data-i18n="choose_wallet">Choose a wallet</div>
      </div>
    </div>
  </div>
</div>
<div id="walletSummary" class="wallet-summary" aria-live="polite"></div>
<p style="max-width:440px; width:100%; color:var(--warn); font-size:13px; margin:-6px 0 22px;" data-i18n="optin_warning">Your Algorand wallet must have USDC opted-in before swapping.</p>

<div class="card">
  <div class="field">
    <label data-i18n="label_send">You send</label>
    <div class="field-row">
      <div class="amount-wrap">
        <span id="fromCurrencyPrefix" class="currency-prefix">$</span>
        <input id="fromAmount" class="amount-input" type="text" inputmode="decimal" placeholder="0.0" oninput="scheduleFetchPreview(); updateSendModeAlt();">
      </div>
      <select id="fromToken" class="token-select" onchange="onPairChange()"></select>
    </div>
    <button id="sendModeToggle" class="mode-toggle" onclick="toggleSendMode()">⇅ <span id="sendModeAlt">—</span></button>
  </div>

  <div class="swap-toggle"><button onclick="flipDirection()" title="Flip">⇅</button></div>

  <div class="field">
    <label data-i18n="label_receive">You receive (est.)</label>
    <div class="field-row">
      <div id="toAmount" class="amount-input" style="color:var(--muted);">—</div>
      <select id="toToken" class="token-select" onchange="onPairChange()"></select>
    </div>
  </div>

  <div id="receipt" class="receipt">
    <div class="line"><span data-i18n="route">Route</span><span id="rProvider">—</span></div>
    <div class="line"><span data-i18n="gas">Estimated gas</span><span id="rGas">—</span></div>
    <div class="line"><span data-i18n="fee">Algorand network fee</span><span>0.01 USDC</span></div>
  </div>

  <button id="cta" class="cta" onclick="executeSwap()" disabled><span class="step-badge">2</span><span id="ctaText">Execute Swap</span></button>
</div>

<p class="status" style="opacity:.65; margin-top:6px;" data-i18n="ledger_hint">Using a hardware wallet for Algorand? Unlock it and open the Algorand app before continuing.</p>

<div id="status" class="status"></div>

let signer = null, userAddress = null, lastPreview = null;
let sendMode = 'token', fromPriceUSD = null, priceTokenKey = null;
let evmProviders = [];
let connectedChainId = null;
let activeEvmProvider = null, evmWalletName = '', walletConnecting = false;
let swapInProgress = false, walletMenuVersion = 0;
let algoWallet = null, algoConfig = null;
const NATIVE = '0x0000000000000000000000000000000000000000';
const PLACEHOLDER_ADDR = '0x0000000000000000000000000000000000000000';

// Direcciones USDC verificadas contra developers.circle.com (no adivinadas).
const CHAIN_INFO = {
  1:     { name: 'Ethereum',  native: 'ETH',   usdc: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48' },
  137:   { name: 'Polygon',   native: 'MATIC', usdc: '0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359' },
  42161: { name: 'Arbitrum',  native: 'ETH',   usdc: '0xaf88d065e77c8cC2239327C5EDb3A432268e5831' },
  8453:  { name: 'Base',      native: 'ETH',   usdc: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913' },
  10:    { name: 'Optimism',  native: 'ETH',   usdc: '0x0b2C639c533813f4Aa9D7837CAf62653d097Ff85' },
  56:    { name: 'BSC',       native: 'BNB' },
  43114: { name: 'Avalanche', native: 'AVAX',  usdc: '0xB97EF9Ef8734C71904D8002F8b6Bc66Dd9c48a6E' },

const TOKENS = [];
for (const [id, c] of Object.entries(CHAIN_INFO)) {
  TOKENS.push({ key: `${id}:native`, chainId: Number(id), address: NATIVE, decimals: 18, label: `${c.native} · ${c.name}` });
  if (c.usdc) TOKENS.push({ key: `${id}:usdc`, chainId: Number(id), address: c.usdc, decimals: 6, label: `USDC · ${c.name}` });
}

const TEXT = {

// Wallet roles are separate: EVM executes the swap; Algorand pays x402.
Object.assign(TEXT.en, {
  evm_role: 'Swap · Ethereum / Arbitrum / EVM', algo_role: 'Fee · Algorand USDC',
  wallet_loading: 'Looking for compatible wallets…', wallet_none: 'No compatible extension detected.',

let lang = localStorage.getItem('lang') || 'en';
function t(key, ...args) {
  const dict = TEXT[lang] || TEXT.en;
  const val = dict[key] !== undefined ? dict[key] : TEXT.en[key];
  return typeof val === 'function' ? val(...args) : val;
}
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll('#langs button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  updateWalletSummary();
}
document.getElementById('langs').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-lang]');
  if (!btn) return;
  lang = btn.dataset.lang;
  localStorage.setItem('lang', lang);
  applyLang();
});
applyLang();

window.addEventListener('eip6963:announceProvider', (event) => {
  const detail = event.detail;
  if (!detail?.info?.uuid || typeof detail.provider?.request !== 'function') return;
  if (!evmProviders.some(p => p.info.uuid === detail.info.uuid || p.provider === detail.provider)) evmProviders.push(detail);
});
window.dispatchEvent(new Event('eip6963:requestProvider'));

// Preload both connectors; neither opens a wallet until the user chooses it.
const loadBackendConfig = () => fetch(`${BACKEND_URL}/config`).then(r => {
  if (!r.ok) throw new Error(t('err_unexpected', r.status));
  return r.json();
}).catch(() => null);
let backendConfigPromise = loadBackendConfig();
let walletModulePromise = import('/wallet-connect.js?v=20260927').then(mod => {
  algoWallet = mod;
  return mod;
}).catch(() => null);
window.addEventListener('algorand-wallet-changed', updateWalletSummary);

async function loadAlgorand() {
  let [config, mod] = await Promise.all([backendConfigPromise, walletModulePromise]);
  if (!config) config = await (backendConfigPromise = loadBackendConfig());
  if (!config || !mod) throw new Error(t('err_unexpected', 0));
  algoConfig = mod.configFromBackend(config, BACKEND_URL);
  return mod;
}

function fillSelect(sel) { sel.innerHTML = TOKENS.map(x => `<option value="${x.key}">${x.label}</option>`).join(''); }

// El origen se filtra a la red activa de la wallet conectada (si hay una);
// el destino siempre muestra todas, porque no hace falta tener fondos ahí.
function fillFromSelect() {
  const sel = document.getElementById('fromToken');
  const prevValue = sel.value;
  let filtered = connectedChainId ? TOKENS.filter(x => x.chainId === connectedChainId) : TOKENS;
  if (filtered.length === 0) filtered = TOKENS; // red no soportada: no dejar el desplegable vacío
  sel.innerHTML = filtered.map(x => `<option value="${x.key}">${x.label}</option>`).join('');
  if (filtered.some(x => x.key === prevValue)) sel.value = prevValue;
}

fillFromSelect();
fillSelect(document.getElementById('toToken'));
document.getElementById('toToken').selectedIndex = 1;

function currentPair(selectId) {
  return TOKENS.find(x => x.key === document.getElementById(selectId).value);
}

function onPairChange() { scheduleFetchPreview(); updateSendModeAlt(); }

// ---- Conversor $ <-> token en "Envías", con el precio real de LI.FI -----
async function ensureFromPrice() {
  const from = currentPair('fromToken');
  const key = `${from.chainId}:${from.address}`;
  if (priceTokenKey === key && fromPriceUSD != null) return fromPriceUSD;
  try {
    const resp = await fetch(`${BACKEND_URL}/price?chain=${from.chainId}&token=${from.address}`);
    if (!resp.ok) throw new Error();
    const data = await resp.json();
    fromPriceUSD = Number(data.price_usd) || null;
    priceTokenKey = key;
  } catch { fromPriceUSD = null; priceTokenKey = null; }
  return fromPriceUSD;
}

async function updateSendModeAlt() {
  const price = await ensureFromPrice();
  const amountStr = document.getElementById('fromAmount').value;
  const alt = document.getElementById('sendModeAlt');
  if (!price || !amountStr || Number(amountStr) <= 0) { alt.textContent = '—'; return; }
  if (sendMode === 'token') {
    alt.textContent = '$' + (Number(amountStr) * price).toLocaleString(undefined, { maximumFractionDigits: 2 });
  } else {
    const symbol = currentPair('fromToken').label.split(' · ')[0];
    alt.textContent = (Number(amountStr) / price).toLocaleString(undefined, { maximumFractionDigits: 6 }) + ' ' + symbol;
  }
}

async function toggleSendMode() {
  const price = await ensureFromPrice();
  if (!price) return; // sin precio disponible todavía, no se puede convertir
  const input = document.getElementById('fromAmount');
  const val = Number(input.value);
  if (val > 0) input.value = sendMode === 'token' ? (val * price).toFixed(2) : (val / price).toFixed(6);
  sendMode = sendMode === 'token' ? 'usd' : 'token';
  document.getElementById('fromCurrencyPrefix').classList.toggle('show', sendMode === 'usd');
  updateSendModeAlt();
  scheduleFetchPreview();
}

function flipDirection() {
  const a = document.getElementById('fromToken').value, b = document.getElementById('toToken').value;
  document.getElementById('fromToken').value = b;
  document.getElementById('toToken').value = a;
  onPairChange();
}

function setStatus(msg, isError) {
  const el = document.getElementById('status');
  el.textContent = msg || '';
  el.style.color = isError ? 'var(--warn)' : 'var(--muted)';
}

let previewDebounce = null, previewToken = 0;
function clearPreview() {
  ++previewToken;
  lastPreview = null;
  document.getElementById('toAmount').textContent = '—';
  document.getElementById('toAmount').style.color = 'var(--muted)';
  document.getElementById('receipt').classList.remove('show');
  const cta = document.getElementById('cta');
  cta.disabled = true; document.getElementById('ctaText').textContent = t('cta_execute'); cta.className = 'cta';
}
clearPreview();

function shortAddress(address) { return address.slice(0, 6) + '…' + address.slice(-4); }

function updateWalletSummary() {
  const payer = algoWallet?.currentPayer();
  const summary = document.getElementById('walletSummary');
  summary.replaceChildren();
  for (const [role, name, address] of [
    ['evm_role', evmWalletName, userAddress],
    ['algo_role', algoWallet?.currentWallet(), payer],
  ]) {
    if (!address) continue;
    const row = document.createElement('div');
    row.textContent = `${t(role)}: ${name} · ${shortAddress(address)}`;
    row.title = address;
    summary.appendChild(row);
  }
  document.getElementById('walletBtnText').textContent = userAddress || payer ? t('wallet_connected') : t('connect');
}

function closeWalletMenu() {
  walletMenuVersion++;
  document.getElementById('walletList').classList.remove('show');
}
function onWalletBtnClick() {
  if (swapInProgress || walletConnecting) return;
  if (document.getElementById('walletList').classList.contains('show')) closeWalletMenu();
  else connectWallet();
}
document.addEventListener('click', event => {
  if (!event.target.closest('.wallet-wrap')) closeWalletMenu();
});
document.addEventListener('keydown', event => { if (event.key === 'Escape') closeWalletMenu(); });

function menuTitle(list, label) {
  const title = document.createElement('div');
  title.className = 'title'; title.textContent = label; list.appendChild(title);
}
function menuButton(list, label, action) {
  const button = document.createElement('button');
  button.type = 'button'; button.className = 'wallet-option'; button.textContent = label;
  button.onclick = async () => {
    if (walletConnecting || swapInProgress) return;
    try { await action(); } catch (err) { setStatus(err.message, true); }
  };
  list.appendChild(button);
  return button;
}

function getEvmOptions() {
  const options = evmProviders.map(p => ({ name: String(p.info.name || 'EVM wallet'), provider: p.provider }));
  // Older extensions may expose a providers array instead of EIP-6963.
  const legacy = window.ethereum?.providers || (options.length ? [] : [window.ethereum]);
  for (const provider of legacy) {
    if (!provider?.request || options.some(o => o.provider === provider)) continue;
    const name = provider.isTalisman ? 'Talisman' : provider.isMetaMask ? 'MetaMask' : provider.isCoinbaseWallet ? 'Coinbase Wallet' : 'EVM wallet';
    options.push({ name, provider });
  }
  return options;
}

async function connectWallet(onlyAlgorand = false) {
  const list = document.getElementById('walletList');
  const version = ++walletMenuVersion;
  list.replaceChildren(); list.classList.add('show');
  menuTitle(list, t('wallet_loading'));
  window.dispatchEvent(new Event('eip6963:requestProvider'));
  let choices = [], mod = null, error = null;
  try { mod = await loadAlgorand(); choices = await mod.discover(algoConfig); }
  catch (err) { error = err; }
  if (version !== walletMenuVersion) return;
  list.replaceChildren();
  if (!onlyAlgorand) {
    menuTitle(list, t('evm_role'));
    const options = getEvmOptions();
    if (!options.length) menuTitle(list, t('wallet_none'));
    for (const option of options) menuButton(list, option.name, () => useProvider(option.provider, option.name));
    if (userAddress) menuButton(list, `${t('disconnect')} · ${evmWalletName}`, disconnectWallet);
  }
  menuTitle(list, t('algo_role'));
  if (error) menuTitle(list, error.message);
  else {
    if (!choices.length) menuTitle(list, t('wallet_none'));
    for (const choice of choices) menuButton(list, choice.name, () => useAlgorand(choice));
    menuButton(list, 'Pera Wallet', () => useAlgorand({ id: 'pera', name: 'Pera Wallet' }));
    if (mod.accounts().length > 1) menuButton(list, t('account_change'), () => showAlgorandAccounts(mod.accounts()));
    if (mod.accounts().length) menuButton(list, `${t('disconnect')} · ${mod.currentWallet()}`, async () => {
      closeWalletMenu(); await mod.disconnect(); updateWalletSummary();
    });
  }
  menuButton(list, t('wallet_refresh'), () => connectWallet(onlyAlgorand));
  menuButton(list, t('wallet_close'), closeWalletMenu);
}

async function useAlgorand(choice) {
  closeWalletMenu(); walletConnecting = true; setStatus(t('wallet_pending'));
  try {
    // Configuration and module were loaded before this click, preserving popup activation for Pera.
    const authorized = await algoWallet.connect(algoConfig, choice);
    if (authorized.length > 1) showAlgorandAccounts(authorized);
    updateWalletSummary(); setStatus('');
  } catch (err) { setStatus(err.message, true); }
  finally { walletConnecting = false; }
}

function showAlgorandAccounts(accounts) {
  const list = document.getElementById('walletList');
  ++walletMenuVersion; list.replaceChildren(); list.classList.add('show');
  menuTitle(list, t('account_choose'));
  for (const account of accounts) {
    const button = menuButton(list, `${account.name || 'Algorand'} · ${shortAddress(account.address)}`, () => {
      algoWallet.selectAccount(account.address); closeWalletMenu(); updateWalletSummary();
    });
    button.title = account.address;
  }
  menuButton(list, t('wallet_close'), closeWalletMenu);
}

function removeEvmListeners() {
  activeEvmProvider?.removeListener?.('chainChanged', onWalletChainChanged);
  activeEvmProvider?.removeListener?.('accountsChanged', onWalletAccountsChanged);
  activeEvmProvider?.removeListener?.('disconnect', disconnectWallet);
}
function disconnectWallet() {
  removeEvmListeners(); activeEvmProvider = null; evmWalletName = '';
  signer = null; userAddress = null; connectedChainId = null;
  closeWalletMenu(); updateWalletSummary(); fillFromSelect(); clearPreview(); setStatus('');
}

async function useProvider(rawProvider, name) {
  walletConnecting = true; closeWalletMenu(); setStatus(t('wallet_pending'));
  try {
    try { await rawProvider.request({ method: 'wallet_requestPermissions', params: [{ eth_accounts: {} }] }); }
    catch (err) {
      // Unsupported method is safe to skip. A rejected request must stop here.
      if (![4200, -32601].includes(Number(err.code))) throw err;
    }
    const provider = new ethers.BrowserProvider(rawProvider, 'any');
    await provider.send('eth_requestAccounts', []);
    const nextSigner = await provider.getSigner();
    const address = await nextSigner.getAddress();
    const chain = Number((await provider.getNetwork()).chainId);
    removeEvmListeners();
    activeEvmProvider = rawProvider; signer = nextSigner; userAddress = address;
    evmWalletName = name; connectedChainId = chain;
    rawProvider.on?.('chainChanged', onWalletChainChanged);
    rawProvider.on?.('accountsChanged', onWalletAccountsChanged);
    rawProvider.on?.('disconnect', disconnectWallet);
    updateWalletSummary(); fillFromSelect(); clearPreview(); scheduleFetchPreview(); setStatus('');
  } catch (err) { setStatus(err.message, true); }
  finally { walletConnecting = false; }
}

function onWalletChainChanged(chainIdHex) {
  connectedChainId = Number(chainIdHex);
  fillFromSelect(); clearPreview();
  if (!swapInProgress) scheduleFetchPreview();
}
async function onWalletAccountsChanged(accounts) {
  if (!accounts?.length) { disconnectWallet(); return; }
  const raw = activeEvmProvider;
  clearPreview();
  try {
    const nextSigner = await new ethers.BrowserProvider(raw, 'any').getSigner(accounts[0]);
    if (raw !== activeEvmProvider) return;
    signer = nextSigner; userAddress = await nextSigner.getAddress(); updateWalletSummary();
    if (!swapInProgress) scheduleFetchPreview();
  } catch (err) { disconnectWallet(); setStatus(err.message, true); }
}

// ---- Vista previa gratis, en vivo -------------------------------------
function scheduleFetchPreview() {
  clearTimeout(previewDebounce);
  previewDebounce = setTimeout(fetchPreview, 450);
}

async function fetchPreview() {
  if (swapInProgress || walletConnecting) return;
  const rawAmountStr = document.getElementById('fromAmount').value;
  if (!rawAmountStr || Number(rawAmountStr) <= 0) { clearPreview(); return; }
  if (!userAddress) { clearPreview(); setStatus(t('connect_to_preview'), true); return; }

  const from = currentPair('fromToken'), to = currentPair('toToken');

  let amountStr = rawAmountStr;
  if (sendMode === 'usd') {
    const price = await ensureFromPrice();
    if (!price) { clearPreview(); setStatus(t('no_price'), true); return; }
    amountStr = (Number(rawAmountStr) / price).toFixed(Math.min(from.decimals, 8));
  }
  const fromAmount = ethers.parseUnits(amountStr, from.decimals).toString();
  const fromAddressParam = userAddress || PLACEHOLDER_ADDR;
  const toAddressParam = userAddress || PLACEHOLDER_ADDR;

  const params = new URLSearchParams({
    from_chain: from.chainId, from_token: from.address,
    to_chain: to.chainId, to_token: to.address,
    from_amount: fromAmount, from_address: fromAddressParam, to_address: toAddressParam,
  });

  const myToken = ++previewToken;
  const cta = document.getElementById('cta');
  try {
    const resp = await fetch(`${BACKEND_URL}/quote?${params}`);
    if (myToken !== previewToken || swapInProgress) return;
    if (!resp.ok) throw new Error(t('err_unexpected', resp.status));
    const data = await resp.json();
    const toAmountHuman = ethers.formatUnits(data.to_amount || '0', to.decimals);
    document.getElementById('toAmount').textContent = Number(toAmountHuman).toLocaleString(undefined, { maximumFractionDigits: 6 });
    document.getElementById('toAmount').style.color = 'var(--text)';
    document.getElementById('rProvider').textContent = data.provider || '—';
    document.getElementById('rGas').textContent = data.estimated_gas_costs_usd != null ? `$${data.estimated_gas_costs_usd}` : '—';
    document.getElementById('receipt').classList.add('show');

    lastPreview = { fromChain: from.chainId, fromToken: from.address, toChain: to.chainId, toToken: to.address, fromAmount };
    cta.disabled = false; document.getElementById('ctaText').textContent = t('cta_execute'); cta.className = 'cta';
    setStatus('');
  } catch (err) {
    if (myToken !== previewToken || swapInProgress) return;
    clearPreview();
    setStatus(err.message, true);
  }
}

// ---- Execute Swap: conecta ambas wallets primero, luego cobra y ejecuta --
async function executeSwap() {
  const cta = document.getElementById('cta');
  if (!lastPreview || cta.disabled || swapInProgress || walletConnecting) return;
  if (!signer) { await connectWallet(); return; }
  if (!algoWallet?.currentPayer()) {
    await connectWallet(true); setStatus(t('algo_choose')); return;
  }
  const trade = { ...lastPreview };
  const swapAddress = userAddress;
  const swapProvider = activeEvmProvider;
  let swapSigner = signer;
  swapInProgress = true;
  closeWalletMenu();
  document.getElementById('walletBtn').disabled = true;
  cta.disabled = true; cta.className = 'cta pending'; setStatus('');

  // Both wallets were explicitly selected before starting the payment.
  let payer, wallet;
  try {
    document.getElementById('ctaText').textContent = t('cta_connecting');
    wallet = algoWallet;
    payer = wallet.currentPayer();
    // Switch the EVM network before charging the Algorand fee.
    try {
      await swapSigner.provider.send('wallet_switchEthereumChain', [{ chainId: '0x' + Number(trade.fromChain).toString(16) }]);
      swapSigner = await swapSigner.provider.getSigner(swapAddress);
      const addresses = await swapProvider.request({ method: 'eth_accounts' });
      const chain = Number(await swapProvider.request({ method: 'eth_chainId' }));
      if (activeEvmProvider !== swapProvider || addresses[0]?.toLowerCase() !== swapAddress.toLowerCase() || chain !== Number(trade.fromChain)) throw new Error();
    } catch { throw new Error(t('err_wrong_chain')); }

    // Aviso temprano si la cuenta de Algorand no tiene USDC activado, antes
    // de gastar el resto del flujo. Si la comprobación en sí falla (red...),
    // seguimos sin bloquear -- es un aviso, no una verificación de seguridad.
    try {
      const info = await fetch(`https://${algoConfig.network}-api.algonode.cloud/v2/accounts/${payer}`).then(r => r.json());
      const hasUsdc = (info.assets || []).some(a => String(a['asset-id']) === algoConfig.asset_id);
      if (!hasUsdc) throw new Error(t('err_no_usdc_optin'));
    } catch (checkErr) {
      if (checkErr.message === t('err_no_usdc_optin')) throw checkErr;
    }
  } catch (err) {
    console.error(err);
    setStatus(err.message, true);
    cta.disabled = false; document.getElementById('ctaText').textContent = t('cta_retry'); cta.className = 'cta error';
    swapInProgress = false; document.getElementById('walletBtn').disabled = false;
    return;
  }

  // 3) Ahora sí, las peticiones de red: cobrar y ejecutar.
  document.getElementById('ctaText').textContent = t('cta_paying');
  try {
    const fromAddressParam = swapAddress;
    const toAddressParam = swapAddress;
    const params = new URLSearchParams({
      from_chain: trade.fromChain, from_token: trade.fromToken,
      to_chain: trade.toChain, to_token: trade.toToken,
      from_amount: trade.fromAmount, from_address: fromAddressParam, to_address: toAddressParam,
    });

    let resp = await fetch(`${BACKEND_URL}/execute?${params}`);
    if (resp.status !== 402) throw new Error(t('err_unexpected', resp.status));

    const prep = await fetch(`${BACKEND_URL}/prepare-payment`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ address: payer }),
    });
    if (!prep.ok) { const b = await prep.json().catch(() => ({})); throw new Error(b.detail || t('err_unexpected', prep.status)); }
    const quoteToSign = await prep.json();
    const paymentHeader = await wallet.sign(quoteToSign);

    // A wallet change while confirming the Algorand signature must not trigger a charge.
    const payingAccounts = await swapProvider.request({ method: 'eth_accounts' });
    const payingChain = Number(await swapProvider.request({ method: 'eth_chainId' }));
    if (activeEvmProvider !== swapProvider || payingAccounts[0]?.toLowerCase() !== swapAddress.toLowerCase() || payingChain !== Number(trade.fromChain)) {
      throw new Error(t('err_wrong_chain'));
    }

    resp = await fetch(`${BACKEND_URL}/execute?${params}`, { headers: { 'PAYMENT-SIGNATURE': paymentHeader } });
    if (!resp.ok) {
      const body = await resp.json().catch(() => ({}));
      throw new Error(body.detail || t('err_payment_not_confirmed', resp.status));
    }
    const full = await resp.json();

    document.getElementById('ctaText').textContent = t('cta_sending');
    const tx = full.transaction_request;
    if (!tx) throw new Error(t('err_no_tx'));

    const currentAccounts = await swapProvider.request({ method: 'eth_accounts' });
    const currentChain = Number(await swapProvider.request({ method: 'eth_chainId' }));
    if (activeEvmProvider !== swapProvider || currentAccounts[0]?.toLowerCase() !== swapAddress.toLowerCase() || currentChain !== Number(trade.fromChain)) {
      throw new Error(t('err_wrong_chain'));
    }

    if (trade.fromToken !== NATIVE) {
      const spender = full.approval_address || tx.to;
      const c = new ethers.Contract(trade.fromToken, [
        'function allowance(address,address) view returns (uint256)',
        'function approve(address,uint256) returns (bool)',
      ], swapSigner);
      const needed = BigInt(trade.fromAmount);
      const current = await c.allowance(swapAddress, spender);
      if (current < needed) {
        setStatus(t('approving'));
        const approveTx = await c.approve(spender, needed);
        await approveTx.wait();
      }
    }
    const sentTx = await swapSigner.sendTransaction({ to: tx.to, data: tx.data, value: tx.value, gasLimit: tx.gasLimit });
    setStatus(t('sent_waiting', sentTx.hash));
    await sentTx.wait();
    document.getElementById('ctaText').textContent = t('cta_done'); cta.className = 'cta';
    setStatus(t('confirmed', sentTx.hash));
  } catch (err) {
    console.error(err);
    setStatus(err.message, true);
    cta.disabled = false; document.getElementById('ctaText').textContent = t('cta_retry'); cta.className = 'cta error';
  } finally {
    swapInProgress = false; document.getElementById('walletBtn').disabled = false;
  }
}
</script>
